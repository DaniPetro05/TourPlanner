<app-toolbar></app-toolbar>
<div class="container">
    <div class="list">
        <input [(ngModel)]="searchQuery" placeholder="Search tours..." />
        <button (click)="search()">Search</button>
        
        <div *ngFor="let tour of tours" (click)="onSelect(tour)" class="tour-item">
        {{ tour.name }}

        <button *ngIf="tour.id !== undefined" (click)="deleteTour(tour.id!)">Delete</button>
        <button (click)="editTour(tour)">Edit</button>
        </div>

        <button (click)="toggleForm()">
            {{ showForm ? 'Cancel' : 'Create Tour' }}
        </button>

        <div *ngIf="showForm">
            <form (ngSubmit)="saveTour()" #tourForm="ngForm">

                <input 
                type="text"
                placeholder="Tour Name"
                [(ngModel)]="newTourForm.name"
                name="name"
                required />

                <input 
                type="text"
                placeholder="Description"
                [(ngModel)]="newTourForm.description"
                name="description"
                required />

                <input
                [(ngModel)]="newTourForm.from"
                name="from"
                placeholder="Start location"
                required />

                <input
                [(ngModel)]="newTourForm.to"
                name="to"
                placeholder="Destination"
                required />

                <select
                [(ngModel)]="newTourForm.transportType"
                name="Transport Type">
                    <option
                        *ngFor="let type of transportTypes"
                        [value]="type">
                        {{ type }}
                    </option>
                </select>

                <textarea
                [(ngModel)]="newTourForm.stopsString"
                name="stops"
                placeholder="Stops (comma separated)"
                ></textarea>

                <input 
                type="text"
                placeholder="Image URL (optional)"
                [(ngModel)]="newTourForm.imagePath"
                name="imagePath" />

                <button type="submit" [disabled]="!tourForm.valid">
                Save
                </button>
            </form>
        </div>
        <button (click)="downloadExport()">Export Tours</button>
        <input type="file" (change)="onFileSelected($event)" />
    </div>

    <div class="detail">
        <app-tour-detail [tour]="selectedTour"></app-tour-detail>
    </div>
</div>
