<form (ngSubmit)="login()" #loginForm="ngForm">
    <input
        type="text"
        [(ngModel)]="username"
        name="username"
        placeholder="Username"
        required>

    <input
        type="password"
        [(ngModel)]="password"
        name="password"
        placeholder="Password"
        required>

    <button type="submit" [disabled]="!loginForm.valid">
        Login
    </button>

    <p>Don't have an account?</p>

    <button type="button" routerLink="/register">
        Register
    </button>
</form>
